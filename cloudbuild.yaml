logsBucket: "gs://$_BUILD_LOGS_BUCKET"

steps:
  # 1️⃣ Clone repo
  - name: 'gcr.io/cloud-builders/git'
    args:
      [
        'clone',
        '--branch', '$_BRANCH_NAME',
        '--single-branch',
        'https://$_GITHUB_ACCESS_TOKEN@github.com/$_REPO_OWNER/$_REPO_NAME.git',
        'privacy-lab-workspace'
      ]
    id: 'clone'

  # 2️⃣ Build Docker image for FastAPI app
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'privacy-lab-workspace'
    args:
      [
        'build',
        '-t', 'us-central1-docker.pkg.dev/$_PROJECT_ID/privacy-lab-repo/privacy-lab-api:latest',
        '-f', 'Dockerfile',
        '.'
      ]
    id: 'build'
    waitFor: ['clone']

  # 3️⃣ Push Docker image to Artifact Registry (same tag!)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$_PROJECT_ID/privacy-lab-repo/privacy-lab-api:latest'
      ]
    id: 'push'
    waitFor: ['build']

  # 4️⃣ Deploy to Cloud Run using that same image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'privacy-lab-api',
        '--image', 'us-central1-docker.pkg.dev/$_PROJECT_ID/privacy-lab-repo/privacy-lab-api:latest',
        '--region', 'us-central1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        # Environment variables from Cloud Build substitutions
        '--set-env-vars', 'GCS_BUCKET_NAME=$_GCS_BUCKET_NAME,GCP_PROJECT_ID=$_PROJECT_ID'
      ]
    id: 'deploy'
    waitFor: ['push']

images:
  - 'us-central1-docker.pkg.dev/$_PROJECT_ID/privacy-lab-repo/privacy-lab-api:latest'

timeout: '900s'